name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The Fe release this project is developed and tested with.
  FE_VERSION: v26.5.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: fe fmt --check
      - run: fe test
      - run: fe build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: End-to-end demo on the production bytecode
        working-directory: demo
        run: |
          npm ci
          npm run demo
      - name: Gas benchmark
        working-directory: demo
        run: npm run bench

  mutation:
    # Plants bugs in the clearing engine and checks that the tests catch them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/mutation-check.sh
